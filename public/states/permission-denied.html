<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Permission Denied — Hanuman.Solutions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Outfit:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<style>
  body { font-family: 'Outfit', sans-serif; }
  .font-brand { font-family: 'Cinzel Decorative', serif; }
  .font-mono { font-family: 'JetBrains Mono', monospace; }
</style>
</head>
<body class="min-h-screen bg-[#0A0502] text-[#F2E8DE] antialiased">
<header class="border-b border-[#FF6700]/20 bg-[#0A0502]/90 backdrop-blur sticky top-0 z-50">
  <div class="mx-auto flex max-w-6xl items-center justify-between px-4 py-3.5 sm:px-6">
    <a href="/states/index.html" class="text-xs font-mono text-[#A89F95] hover:text-[#FF6700] flex items-center gap-1.5 transition-colors">
      <i data-lucide="arrow-left" class="w-4 h-4"></i> Back to Outage States
    </a>
    <span class="font-mono text-xs text-[#a78bfa]">State 07 / Permission Denied</span>
  </div>
</header>
<main class="mx-auto max-w-2xl px-4 py-20 text-center">
  <div class="inline-flex h-20 w-20 items-center justify-center rounded-2xl border border-[#a78bfa]/30 bg-[#140a05] mb-6 text-[#a78bfa]">
    <i data-lucide="shield-alert" class="w-10 h-10"></i>
  </div>
  <h1 class="font-brand text-2xl font-bold text-white mb-2">Emergency Console Clearance Required</h1>
  <p class="text-[#A89F95] text-sm max-w-md mx-auto mb-8 leading-relaxed">
    Access to active outage debug console <code class="font-mono text-white bg-[#140a05] px-2 py-0.5 rounded border border-[#FF6700]/20">incident-console-live</code> requires Lead Debugger security credentials.
  </p>

  <div class="mx-auto max-w-sm rounded-xl border border-[#FF6700]/20 bg-[#140a05] p-4 text-left font-mono text-xs mb-8 space-y-2">
    <div class="flex justify-between text-[#A89F95]">
      <span>Required Clearance:</span>
      <span class="text-[#a78bfa] font-bold">Lead Debugger (Level 5)</span>
    </div>
    <div class="flex justify-between text-[#A89F95]">
      <span>Current Session:</span>
      <span class="text-white">Unauthenticated Observer</span>
    </div>
  </div>

  <div class="flex flex-wrap items-center justify-center gap-3">
    <button class="inline-flex items-center gap-2 rounded-lg bg-[#FF6700] px-4 py-2.5 text-sm font-semibold text-[#0A0502] hover:bg-[#ff8547] transition-colors">
      <i data-lucide="key" class="w-4 h-4"></i> Authenticate Debugger Key
    </button>
    <button class="inline-flex items-center gap-2 rounded-lg border border-[#FF6700]/30 bg-[#140a05] px-4 py-2.5 text-sm font-medium text-[#F2E8DE] hover:border-[#FF6700] hover:text-white transition-colors">
      <i data-lucide="file-check" class="w-4 h-4 text-[#A89F95]"></i> Request Emergency Elevation
    </button>
  </div>
</main>
<script>lucide.createIcons();</script>
</body>
</html>
